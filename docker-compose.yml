version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_naufal  # Ganti NAMA dengan nama panggilan Anda
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "22023:5432"  # Ganti XXX dengan 3 digit terakhir NIM Anda
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_naufal   # Ganti NAMA dengan nama panggilan Anda
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "44023:80"     # Ganti XXX dengan 3 digit terakhir NIM Anda
    depends_on:
      - postgres_db
    networks:
      - db-network

volumes:
  pgdata:

networks:
  db-network:
    driver: bridge